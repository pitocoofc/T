name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependências
        run: npm install

      - name: Sincronizar Plataforma Android
        run: |
          npx cap add android || true
          npx cap sync android

      # --- NOVO PASSO: Injeta o Manifest com as Permissões ---
      - name: Injetar AndroidManifest.xml com permissões
        run: |
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Gerar APK no Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: SuperArchiver-Debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
