name: Build Android Native (Kotlin)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Roda o Gradle nativo instalado na máquina virtual do GitHub
      - name: Compilar APK Debug
        run: gradle assembleDebug

      - name: Enviar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: SuperArchiver-Kotlin-Debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
